spring:
  application:
    name: time-capsule-wishes
  profiles:
    active: dev
  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:timecapsuledb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driverClassName: org.h2.Driver
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  h2:
    console:
      enabled: true
      path: /h2-console

app:
  jwt:
    secret: "default-dev-secret-key-that-is-at-least-256-bits-long-for-hmac-sha-256-dev-only"
    expiration-ms: 86400000
    refresh-expiration-ms: 604800000
  ai:
    gemini:
      api-key: "${GEMINI_API_KEY:mock-gemini-key}"
      model: "${GEMINI_MODEL:gemini-2.0-flash}"
    groq:
      api-key: "${GROQ_API_KEY:mock-groq-key}"
      model: "${GROQ_MODEL:llama-3.1-70b-versatile}"
  cors:
    allowed-origins: "${CORS_ALLOWED_ORIGINS:http://localhost:5173}"

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driverClassName: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 25
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
  ai:
    gemini:
      api-key: ${GEMINI_API_KEY}
      model: ${GEMINI_MODEL:gemini-2.0-flash}
    groq:
      api-key: ${GROQ_API_KEY}
      model: ${GROQ_MODEL:llama-3.1-70b-versatile}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
